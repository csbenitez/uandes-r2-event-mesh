# Trigger de Knative en On-Premise que filtra eventos de telemetría AMI
# y los reenvía automáticamente al Ingress de Azure AKS mediante canal seguro HTTPS / TLS
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: trigger-forward-ami-to-cloud
  namespace: voltera-onprem
spec:
  broker: onprem-broker
  filter:
    attributes:
      type: com.voltera.ami.lectura_registrada
  subscriber:
    uri: "https://voltera-dev-mesh.eastus2.cloudapp.azure.com/events"

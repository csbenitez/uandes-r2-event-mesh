# ==============================================================================
# Ejemplo KEDA: Escalar microservicios de Voltera basado en eventos y horarios
# (Compatible con K3s local y Azure AKS sin requerir bases de datos externas)
# ==============================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: billing-service-scaler
  namespace: voltera
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-service
  minReplicaCount: 1  # Mínimo 1 pod en horario normal
  maxReplicaCount: 5  # Límite máximo para preservar cuotas FinOps
  cooldownPeriod:  30  # Segundos antes de reducir réplicas tras pico de carga
  pollingInterval: 15  # Intervalo de verificación del escalador en segundos

  triggers:
    # Trigger 1: Escalado preventivo durante horas de máxima generación solar (CREG 174 / 101-072)
    # Entre las 10:00 y las 15:00 COT (15:00 - 20:00 UTC), anticipa la ráfaga de lecturas AMI
    - type: cron
      metadata:
        timezone: America/Bogota
        start: "0 10 * * *"
        end: "0 15 * * *"
        desiredReplicas: "3"

    # Trigger 2: Escalado reactivo por uso de CPU cuando hay ráfagas de cálculo de Netting
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75" # Escala si la utilización supera el 75%

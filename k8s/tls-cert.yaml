# Configuración consolidada de TLS con cert-manager y Let's Encrypt para AKS
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: istio
spec:
  controller: istio.io/ingress-controller
---
apiVersion: v1
kind: Service
metadata:
  name: cert-manager-solver
  namespace: istio-system
spec:
  ports:
  - port: 8089
    targetPort: 8089
    name: http
  selector:
    acme.cert-manager.io/http01-solver: "true"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: cbenitezm@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        ingress:
          ingressClassName: istio
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: voltera-ingress-cert
  namespace: istio-system
spec:
  secretName: voltera-ingress-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "voltera-dev-mesh.eastus2.cloudapp.azure.com"

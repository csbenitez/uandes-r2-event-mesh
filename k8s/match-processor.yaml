# Match Processor con Idempotencia
apiVersion: v1
kind: Service
metadata:
  name: match-processor
  namespace: voltera
  labels:
    app: match-processor
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: match-processor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-processor
  namespace: voltera
  labels:
    app: match-processor
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: match-processor
      version: v1
  template:
    metadata:
      labels:
        app: match-processor
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: match-processor
        image: match-processor:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: DB_HOST
          value: "postgres-matches"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "voltera"
        - name: DB_PASSWORD
          value: "voltera_pass"
        - name: DB_NAME
          value: "voltera_matches"
        - name: REDIS_HOST
          value: "redis-idempotency"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
# Knative Trigger para recibir eventos de match
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: trigger-match-processor
  namespace: voltera
spec:
  broker: cloud-broker
  filter:
    attributes:
      type: com.voltera.match.created
  subscriber:
    ref:
      apiVersion: v1
      kind: Service
      name: match-processor
    uri: /events
---
# KEDA ScaledObject (opcional - escalar basado en queue lag)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: match-processor-scaler
  namespace: voltera
spec:
  scaleTargetRef:
    name: match-processor
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 30
  triggers:
  # Escalar basado en eventos pendientes en el broker
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
      metricName: knative_trigger_event_count
      threshold: "10"
      query: |
        sum(rate(knative_trigger_event_count{trigger="trigger-match-processor"}[1m]))

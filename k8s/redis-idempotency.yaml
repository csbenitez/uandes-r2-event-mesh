# Redis para caché de idempotencia (fast path)
apiVersion: v1
kind: Service
metadata:
  name: redis-idempotency
  namespace: voltera
  labels:
    app: redis-idempotency
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis-idempotency
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-idempotency
  namespace: voltera
  labels:
    app: redis-idempotency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-idempotency
  template:
    metadata:
      labels:
        app: redis-idempotency
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --maxmemory
        - 256mb
        - --maxmemory-policy
        - allkeys-lru
        - --save
        - ""
        - --appendonly
        - "no"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
